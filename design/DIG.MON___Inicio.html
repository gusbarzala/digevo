      </p>

  <script>
    (function () {
      var soundBtn = document.getElementById('sound-toggle');
      var soundIcon = document.getElementById('sound-icon');
      var loginForm = document.getElementById('login-form');
      var usernameInput = document.getElementById('username');
      var passwordInput = document.getElementById('password');
      var togglePasswordBtn = document.getElementById('toggle-password');
      var passwordEye = document.getElementById('password-eye');
      var startStatus = document.getElementById('start-status');
      var muted = false;

      if (soundBtn && soundIcon) {
        soundBtn.addEventListener('click', function () {
          muted = !muted;
          soundIcon.textContent = muted ? 'volume_off' : 'volume_up';
          soundBtn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar sonido');
        });
      }

      if (togglePasswordBtn && passwordInput && passwordEye) {
        togglePasswordBtn.addEventListener('click', function () {
          var isHidden = passwordInput.type === 'password';
          passwordInput.type = isHidden ? 'text' : 'password';
          passwordEye.textContent = isHidden ? 'visibility_off' : 'visibility';
          togglePasswordBtn.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
      }

      if (loginForm && startStatus) {
        loginForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var user = usernameInput ? usernameInput.value.trim() : '';
          var pass = passwordInput ? passwordInput.value.trim() : '';
          if (!user || !pass) {
            startStatus.textContent = 'COMPLETA USUARIO Y CONTRASEÑA';
            return;
          }
          startStatus.textContent = 'BIENVENIDO, ' + user.toUpperCase() + '!';
        });
      }
    })();
  </script>

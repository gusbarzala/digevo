      var currentLineKey = 'gabumon';
      var previewImg = document.getElementById('line-preview-img');
      var stageBadge = document.getElementById('line-stage-badge');
      var nameEl = document.getElementById('line-evo-name');
      var attackEl = document.getElementById('line-evo-attack');
      var statusEl = document.getElementById('line-status');
      var lineTabs = document.querySelectorAll('.line-tab');
      var stageBtns = document.querySelectorAll('.stage-btn');

      function selectStage(idx) {
        var line = LINES[currentLineKey];
        var item = line.stages[idx];
        stageBtns.forEach(function (b, i) {
          if (i === idx) {
            b.classList.remove('bg-light-surface-container', 'text-light-on-surface');
            b.classList.add('bg-light-primary', 'text-light-on-primary');
          } else {
            b.classList.remove('bg-light-primary', 'text-light-on-primary');
            b.classList.add('bg-light-surface-container', 'text-light-on-surface');
          }
        });
        previewImg.src = item.img;
        previewImg.alt = item.name;
        stageBadge.textContent = item.stage;
        nameEl.textContent = item.name;
        attackEl.textContent = 'Ataque: ' + item.atk;
        statusEl.textContent = item.name + ' (' + line.kid + '): ' + item.atk + '.';
      }

      lineTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          lineTabs.forEach(function (t) {
            t.classList.remove('bg-light-primary', 'text-light-on-primary');
            t.classList.add('bg-light-surface-container', 'text-light-on-surface');
          });
          tab.classList.remove('bg-light-surface-container', 'text-light-on-surface');
          tab.classList.add('bg-light-primary', 'text-light-on-primary');

          currentLineKey = tab.getAttribute('data-line');
          var line = LINES[currentLineKey];
          stageBtns.forEach(function (btn, idx) {
            btn.querySelector('span').textContent = (idx + 1) + '. ' + line.stages[idx].name;
          });
          selectStage(2);
        });
      });

      stageBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          selectStage(idx);
        });
      });
    })();
  </script>

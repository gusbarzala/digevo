          soundIcon.textContent = muted ? 'volume_off' : 'volume_up';
        });
      }

      var statusEl = document.getElementById('crest-status');
      var cards = document.querySelectorAll('.crest-card');
      cards.forEach(function (card) {
        card.addEventListener('click', function () {
          cards.forEach(function (c) {
            c.classList.remove('bg-light-primary-container');
            c.classList.add('bg-light-surface-container');
          });
          card.classList.remove('bg-light-surface-container');
          card.classList.add('bg-light-primary-container');

          var child = card.getAttribute('data-child');
          var crest = card.getAttribute('data-crest');
          var boost = card.getAttribute('data-boost');
          statusEl.textContent = '¡Joya de ' + crest + ' (' + child + ') activada! ' + boost + '.';
        });
      });
    })();
  </script>


</body></html>

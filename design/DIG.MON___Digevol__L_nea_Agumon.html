  <script>
    (function () {
      var soundBtn = document.getElementById('sound-toggle');
      var soundIcon = document.getElementById('sound-icon');
      var muted = false;
      if (soundBtn && soundIcon) {
        soundBtn.addEventListener('click', function () {
          muted = !muted;
          soundIcon.textContent = muted ? 'volume_off' : 'volume_up';
        });
      }

      var previewImg = document.getElementById('evo-preview-img');
      var stageBadge = document.getElementById('evo-stage-badge');
      var nameEl = document.getElementById('evo-name');
      var attackEl = document.getElementById('evo-attack');
      var statusEl = document.getElementById('digevol-status');
      var buttons = document.querySelectorAll('.agumon-form');

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          buttons.forEach(function (b) {
            b.classList.remove('bg-light-primary', 'text-light-on-primary');
            b.classList.add('bg-light-surface-container', 'text-light-on-surface');
          });
          btn.classList.remove('bg-light-surface-container', 'text-light-on-surface');
          btn.classList.add('bg-light-primary', 'text-light-on-primary');

          var name = btn.getAttribute('data-name');
          var stage = btn.getAttribute('data-stage');
          var atk = btn.getAttribute('data-atk');
          var img = btn.getAttribute('data-img');

          if (previewImg && img) {
            previewImg.src = img;
            previewImg.alt = name;
          }
          stageBadge.textContent = stage;
          nameEl.textContent = name;
          attackEl.textContent = 'Ataque: ' + atk;
          statusEl.textContent = '¡Digievolución lista: ' + name + '!';
        });
      });

      var kidBtns = document.querySelectorAll('.kid-btn');
      kidBtns.forEach(function (kbtn) {
        kbtn.addEventListener('click', function () {
          kidBtns.forEach(function (b) {
            b.classList.remove('bg-light-primary', 'text-light-on-primary');
            b.classList.add('bg-light-surface-container', 'text-light-on-surface');
          });
          kbtn.classList.remove('bg-light-surface-container', 'text-light-on-surface');
          kbtn.classList.add('bg-light-primary', 'text-light-on-primary');
          var kid = kbtn.getAttribute('data-kid');
          var partner = kbtn.getAttribute('data-partner');
          statusEl.textContent = 'Niño elegido: ' + kid + ' (Compañero: ' + partner + ').';
        });
      });
    })();
  </script>
